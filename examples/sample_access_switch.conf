version 17.6
hostname ACCESS-SW-FLOOR3
!
aaa new-model
aaa authentication login default group tacacs+ local
!
username netadmin privilege 15 algorithm-type scrypt secret Tr0ub4dor&3
!
enable algorithm-type scrypt secret Xk9!mP2qLw
!
no ip domain lookup
no ip http server
no cdp run
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree loopguard default
!
ip dhcp snooping
ip dhcp snooping vlan 100,200
!
ip arp inspection vlan 100,200
ip arp inspection validate src-mac dst-mac ip
!
vlan 100
 name USERS
vlan 200
 name VOICE
vlan 666
 name UNUSED_NATIVE
!
interface GigabitEthernet1/0/1
 description Uplink to DIST-SW01
 switchport mode trunk
 switchport trunk allowed vlan 100,200
 switchport trunk native vlan 666
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 spanning-tree guard root
 udld port aggressive
!
interface GigabitEthernet1/0/2
 description User - Desk 302
 switchport mode access
 switchport access vlan 100
 switchport voice vlan 200
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 storm-control broadcast level 1.00
 ip dhcp snooping limit rate 8
 ip verify source
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/3
 description User - Desk 303
 switchport mode access
 switchport access vlan 100
!
interface GigabitEthernet1/0/4
 description User - Desk 304
 switchport mode access
 switchport access vlan 100
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
!
line con 0
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 access-class MGMT-ACL in
 login authentication default
!
ip access-list standard MGMT-ACL
 permit 10.10.99.0 0.0.0.255
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
logging host 10.10.99.20
service timestamps log datetime msec
!
end
