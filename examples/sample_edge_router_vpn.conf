version 17.9
hostname EDGE-RTR-HQ01
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
!
username jtavana privilege 15 algorithm-type scrypt secret Str0ngP@ssw0rd!2026
!
enable algorithm-type scrypt secret An0therStr0ngOne!
!
no ip domain lookup
no ip http server
no cdp run
no ip source-route
!
crypto pki trustpoint EDGE-CA
 enrollment url https://ca.example.com:443
 subject-name CN=edge-rtr-hq01.example.com
 revocation-check crl
 hash sha256
 rsakeypair EDGE-KEY 2048
!
crypto ikev2 proposal IKEV2-PROP-STRONG
 encryption aes-gcm-256
 prf sha384
 group 20
!
crypto ikev2 proposal IKEV2-PROP-LEGACY
 encryption 3des
 integrity md5
 group 2
!
crypto ikev2 policy IKEV2-POL
 proposal IKEV2-PROP-STRONG
!
crypto ikev2 keyring IKEV2-KEYRING
 peer BRANCH01
  address 203.0.113.10
  pre-shared-key CorrectHorseBatteryStaple!
 peer BRANCH02
  address 203.0.113.20
  pre-shared-key CorrectHorseBatteryStaple!
!
crypto ikev2 profile IKEV2-PROFILE
 match identity remote address 203.0.113.10 255.255.255.255
 authentication local pre-share
 authentication remote pre-share
 keyring local IKEV2-KEYRING
 dpd 10 5 on-demand
 nat-traversal 20
!
crypto ipsec transform-set TSET-STRONG esp-gcm 256
 mode tunnel
!
crypto ipsec profile IPSEC-PROFILE
 set transform-set TSET-STRONG
 set ikev2-profile IKEV2-PROFILE
 set pfs group19
 set security-association lifetime seconds 3600
!
interface Tunnel10
 description VTI to BRANCH01
 ip address 10.255.10.1 255.255.255.252
 tunnel source GigabitEthernet0/0/0
 tunnel destination 203.0.113.10
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile IPSEC-PROFILE
!
interface GigabitEthernet0/0/0
 description ISP-Uplink
 ip address 198.51.100.5 255.255.255.252
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 ip verify unicast source reachable-via rx
!
router bgp 65010
 neighbor 198.51.100.6 remote-as 65099
 neighbor 198.51.100.6 password Cisco123
!
router ospf 1
 router-id 10.0.0.1
 passive-interface default
 no passive-interface Tunnel10
 network 10.255.10.0 0.0.0.3 area 0
!
control-plane
 service-policy input COPP-POLICY
!
class-map match-any CM-ICMP
 match protocol icmp
!
policy-map COPP-POLICY
 class CM-ICMP
  police 64000 conform-action transmit exceed-action drop
 class class-default
  police 8000 conform-action transmit exceed-action drop
!
line vty 0 4
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 exec-timeout 10 0
 transport input ssh
!
ip ssh version 2
!
end
