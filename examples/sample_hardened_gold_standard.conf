version 17.9
hostname HARDENED-DIST-SW01
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa authorization commands 15 default group tacacs+ local
aaa authorization config-commands
aaa accounting exec default start-stop group tacacs+
aaa accounting commands 15 default start-stop group tacacs+
aaa local authentication attempts max-fail 5
!
tacacs server TACACS-PRIMARY
 address ipv4 10.10.1.10
 key MyVeryLongAndRandomSharedSecretValue2026
!
username jtavana privilege 15 algorithm-type scrypt secret Cf9!x2Lm7Qz$Rt4Wv
!
enable algorithm-type scrypt secret Gh8@Pn3Kx9Ru7Ez
!
security passwords min-length 12
service password-encryption
!
no ip domain lookup
no ip http server
no cdp run
no lldp run
no ip source-route
no vstack
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree loopguard default
udld aggressive
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
!
ip arp inspection vlan 10,20,30
ip arp inspection validate src-mac dst-mac ip
!
device-tracking policy IPDT-POLICY
 limit address-count 4
 security-level glean
!
vlan 10
 name DATA
vlan 20
 name VOICE
vlan 999
 name NATIVE_UNUSED
!
interface GigabitEthernet1/0/1
 description Uplink to CORE-SW01
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 switchport trunk native vlan 999
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 spanning-tree guard root
 udld port aggressive
!
interface GigabitEthernet1/0/2
 description User Access Port
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 storm-control broadcast level 1.00
 storm-control multicast level 1.00
 ip dhcp snooping limit rate 8
 ip verify source
 device-tracking attach-policy IPDT-POLICY
 spanning-tree bpduguard enable
!
interface Vlan10
 ip address 10.10.10.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 ip verify unicast source reachable-via rx
 standby 10 ip 10.10.10.254
 standby 10 authentication md5 key-string Vx8!qNmR2eS9
!
router ospf 1
 router-id 10.10.10.1
 passive-interface default
 no passive-interface Vlan10
 area 0 authentication message-digest
!
control-plane
 service-policy input COPP-POLICY
!
ip access-list extended ACL-ICMP
 permit icmp any any
ip access-list extended ACL-MGMT
 permit tcp 10.10.99.0 0.0.0.255 any eq 22
 permit udp 10.10.99.0 0.0.0.255 any eq 161
 deny ip any any log
!
class-map match-any CM-ICMP
 match access-group name ACL-ICMP
class-map match-any CM-MGMT
 match access-group name ACL-MGMT
!
policy-map COPP-POLICY
 class CM-ICMP
  police 64000 conform-action transmit exceed-action drop
 class CM-MGMT
  police 32000 conform-action transmit exceed-action drop
 class class-default
  police 8000 conform-action transmit exceed-action drop
!
crypto pki trustpoint MGMT-CA
 enrollment url https://ca.example.com:443
 subject-name CN=hardened-dist-sw01.example.com
 revocation-check crl ocsp
 hash sha256
 rsakeypair MGMT-KEY 2048
!
no service password-recovery
config-register 0x2102
boot system flash:cat9k_iosxe.17.09.04a.SPA.bin
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login authentication default
line aux 0
 no exec
 transport input none
line vty 0 15
 exec-timeout 10 0
 transport input ssh
 access-class ACL-MGMT in
 login authentication default
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm kex ecdh-sha2-nistp256
ip ssh server algorithm encryption aes256-ctr
ip ssh server algorithm mac hmac-sha2-256
!
snmp-server group SNMP-ADMINS v3 priv
snmp-server user netmon SNMP-ADMINS v3 auth sha AuthPass123! priv aes 256 PrivPass123!
!
ntp authenticate
ntp authentication-key 1 md5 NtpKeyValue123
ntp trusted-key 1
ntp server 10.10.1.20
ntp access-group peer NTP-ACL
!
ip access-list standard NTP-ACL
 permit 10.10.1.20
!
logging host 10.10.1.30
service timestamps log datetime msec localtime show-timezone
login on-failure log
login on-success log
!
errdisable recovery cause bpduguard
errdisable recovery cause psecure-violation
errdisable recovery interval 300
!
banner login ^
Authorized access only. All activity may be monitored and reported.
^
!
end
